# the empty provider
%YAML 1.1
---
name: PromptSpeechRunner
spec_type: provider
spec_version: 1.2
description: "The provider for the speech prompting capability and uses functionalities from prompt 
              tools stack"
implements: prompt_capabilities/PromptSpeechRunner
runner: capabilities2_runner::PromptSpeechRunner

definition: 
  command: "<Runner interface=prompt_capabilities/PromptSpeechRunner provider=prompt_capabilities/PromptSpeechRunner speech_text='$value' flush='true' uuid='$value' />'"
  configuration_parameters:
    - name: speech_text
      type: string
      description: "The text or information to be converted to speech."
    - name: uuid
      type: string
      description: "The unique identifier to match the correct prompt tools cache that contains
                    the information needed for planning which are cached before and after this 
                    capability by other capabilities."
    - name: flush
      type: boolean
      description: "A boolean to indicate whether to flush the current prompt tools cache or not. 
                    This needs to be 'true' if this is the last capability in the plan with flush 
                    parameter indicating all information has been cached. If not set, it should 
                    be 'false'."
  runtime_parameters:
    output:
      - name: speech
        type: string
        description: "The human like speech text generated by the LLM for the given input text. 
                      This can be used for downstream speech synthesis."