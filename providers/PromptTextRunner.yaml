# the empty provider
%YAML 1.1
---
name: PromptTextRunner
spec_type: provider
spec_version: 1.2
description: "The provider for the text prompting capability and uses functionalities from prompt 
              tools stack"
implements: prompt_capabilities/PromptTextRunner
runner: capabilities2_runner::PromptTextRunner

definition: 
  command: "<Runner interface=prompt_capabilities/PromptTextRunner provider=prompt_capabilities/PromptTextRunner text='$text' uuid='$uuid' flush='false' />'"
  configuration_parameters:
    - name: text
      type: string
      description: "The text or information to be shared with the planning entity"
    - name: uuid
      type: string
      description: "The unique identifier to match the correct prompt tools cache that contains
                    the information needed for planning which are cached before and after this 
                    capability by other capabilities."
    - name: flush
      type: boolean
      description: "A boolean to indicate whether to flush the current prompt tools cache or not. 
                    This needs to be 'true' if this is the last capability in the plan with flush 
                    parameter indicating all information has been cached. If not set, it should 
                    be 'false'."
  runtime_parameters:
    input:
      - name: text
        type: string
        description: "The text or information to be shared with the planning entity"