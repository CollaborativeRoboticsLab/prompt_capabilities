%YAML 1.1
---
name: PromptCapabilityRunner
spec_version: 1.1
spec_type: interface
description: "This capability allows a decision making authority such as an LLM to receive robot capability information from the robot. It consumes the
              `CapabilitySpecs` values gathered from upstream capability-spec providers and forwards them through the prompt service. This will prompt the
              capabilities in text form and would allow the decision making authority to understand the capabilities of the robot. Default plans can include
              this, so an external planner does not need to insert it manually at the beginning of every task."
interface:
  services:
    "/prompt/prompt":
      type: "prompt_msgs/srv/Prompt"
      description: "This service focuses on capturing capabilities of the robot and transfering them to decision making authority."