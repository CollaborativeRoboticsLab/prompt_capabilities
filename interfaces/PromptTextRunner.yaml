%YAML 1.1
---
name: PromptTextRunner
spec_version: 1.1
spec_type: interface
description: "This capability allows a plan to share additional information with a decision making authority such as an LLM. This capability can be 
              trigged with the xml command '<Runner interface=prompt_capabilities/PromptTextRunner provider=prompt_capabilities/PromptTextRunner text='$text' uuid='$uuid'/>'. 
              $text will hold the information to be shared. $uuid will hold the unique identifier for this interaction. This will prompt the decision making authority."
interface:
  services:
    "/prompt":
      type: "prompt_msgs/srv/Prompt"
      description: "This capability focuses on capturing information from the robot as text and transferring it to the decision making authority."