%YAML 1.1
---
name: PromptTextRunner
spec_version: 1.1
spec_type: interface
description: "This capability allows a plan to share additional information with a decision making authority such as an LLM. This capability can be
              triggered with the xml command '<Runner interface=prompt_capabilities/PromptTextRunner provider=prompt_capabilities/PromptTextRunner text='$text' uuid='$uuid' flush='false' />'.
              `$text` holds the information to be shared and `$uuid` holds the unique identifier for this interaction. This runner forwards the text to the prompt
              service and does not emit a dedicated output parameter of its own."
interface:
  services:
    "/prompt/prompt":
      type: "prompt_msgs/srv/Prompt"
      description: "This capability focuses on capturing information from the robot as text and transferring it to the decision making authority."