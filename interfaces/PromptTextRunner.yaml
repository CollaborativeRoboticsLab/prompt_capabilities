%YAML 1.1
---
name: PromptTextRunner
spec_version: 1.2
spec_type: interface
description: "This capability allows a planning entity to gather information regarding the 
              environment in the format of text. This information is then used for the planning 
              process mainly when generating next plan or when decisions are needed to be made 
              based on the collected data."
interface:
  services:
    "/prompt/prompt":
      type: "prompt_msgs::srv::Prompt"
      description: "This service is from the prompt tools stack and is used to prompt information.
                    This capability prompts the text data to the planning entity."