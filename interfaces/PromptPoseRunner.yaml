%YAML 1.1
---
name: PromptPoseRunner
spec_version: 1.1
spec_type: interface
description: "This capability allows a decision making authority such as an LLM to receive robot pose and orientation data from the robot. This capability
              can be triggered with the xml command '<Runner interface=prompt_capabilities/PromptPoseRunner provider=prompt_capabilities/PromptPoseRunner uuid='$uuid' flush='false' />'.
              This will allow the decision making authority to understand the position of the robot. Data for this is generated by a capability such as
              nav2_capabilities/RobotPoseRunner which should be triggered before PromptPoseRunner using an xml command such as
              '<Runner interface=nav2_capabilities/RobotPoseRunner provider=nav2_capabilities/RobotPoseRunner map='map' odom='odom' robot='base_link' time_buffer='5.0' />'"
interface:
  services:
    "/prompt/prompt":
      type: "prompt_msgs/srv/Prompt"
      description: "This service focuses on capturing pose (position and orientation) of the robot and transfering them to decision making authority."