%YAML 1.1
---
name: PromptPoseRunner
spec_version: 1.2
spec_type: interface
description: "This capability allows a planning entity to gather robot pose and orientation 
              data from the robot and understand where the robot is located in the environment. 
              This is a core requirement for other capabilities that require knowledge of the
              position of the robot."
interface:
  services:
    "/prompt/prompt":
      type: "prompt_msgs::srv::Prompt"
      description: "This service is from the prompt tools stack and is used to prompt information.
                    This capability prompts the robot pose and orientation data."