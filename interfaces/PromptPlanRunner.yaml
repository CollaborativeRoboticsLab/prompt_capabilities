%YAML 1.1
---
name: PromptPlanRunner
spec_version: 1.1
spec_type: interface
description: "This capability requests an decision making authority such as an LLM to create a new plan at the end of an execution plan. This capability 
              can be trigged with an xml command such as 
              '<Runner interface=capabilities2_runner_prompt/PromptPlanRunner provider=capabilities2_runner_prompt/PromptPlanRunner replan=false task=$task/>'. This will prompt the 
              decision making authority to create a new execution plan either to continue the current task or to focus on a new task given by $task value 
              depending on the state of the robot. This capability needs to be in every execution plan created and needs be the capability before the last 
              in any  plan. All execution plans generated by a decision making authority need to be contained within <Plan> and </Plan> xml tags. <Control type= name=> </Control>
              has two attributes, type and name. The type attribute can be one of the following values: sequential, parallel_any, parallel_all, recovery. The name 
              attribute is optional and can be used to give a name to the control flow.

              '<?xml version='1.0' encoding='UTF-8'?>' should be the first line of the xml file and it is not a part of the plan. Additionally the attribute values
              should be enclosed within double quotes. The plan can contain multiple control flows and capabilities. Keep the interface and provider attributes of the Runner
              correctly matched with their namespace and wrong interface and provider values will result in the plan not being executed.
              
              Capabilities in the sequential control flow will be triggered one after the other depending on precceding capability's successful completion 
              and need to be contained within <Control type=sequential name=name_of_flow> </Control> xml tags. 
              
              Capabilities in the parallel_any control flow will be triggered one after another depending on precceding capability's successful start up and 
              will be executed parallely. Capabilities under parallel_any control flow needs to come within <Control type=parallel_any name=name_of_flow> </Control> xml tags.
              In this case, the control block will wait at least one capability to finish before proceeding to execute the rest of the capabilities in the plan.

              Capabilities in the parallel_all control flow will be triggered one after another depending on precceding capability's successful start up and 
              will be executed parallely. Capabilities under parallel_all control flow needs to come within <Control type=parallel_all name=name_of_flow> </Control> xml tags. 
              In this case, the control block will wait for all capabilities to finish before proceeding to to execute the rest of the capabilities in the plan.
              
              Capabilities in the recovery control flow will be triggered one after other depending only on precceding capability's failed execution and 
              capabilities under recovery control flow need to come within <Control type=recovery name=name_of_flow> </Control> xml tags. recovery control flow does not need
              an acompanying parallel or sequential control flow and can be used as a standalone control flow.

              Upon the successful execution of this capability and creation of a plan, another capability need to be executed for verifying and starting the 
              execution of the new plan. It can be done via '<Runner interface=capabilities2_runner_prompt/FabricSetPlanRunner provider=capabilities2_runner_prompt/FabricSetPlanRunner/>' 
              xml command.
              
              If the task has been completed according to the feedback information, do not include 
              '<Runner interface=capabilities2_runner_prompt/FabricSetPlanRunner provider=capabilities2_runner_prompt/FabricSetPlanRunner/>' in the generated plan.
              
              example plan:
              '<?xml version='1.0' encoding='UTF-8'?>
              <Plan name='navigate_or_return_fabric'>
                  <Control type='sequential' name='contro_plan'>
                      <Control type='sequential' name='main_execution_plan'>
                          <Runner interface='capabilities2_runner_capabilities/CapabilityGetRunner' provider='capabilities2_runner_capabilities/CapabilityGetRunner'/>
                          <Runner interface='capabilities2_runner_prompt/PromptCapabilityRunner' provider='capabilities2_runner_prompt/PromptCapabilityRunner' />
                          <Runner interface='capabilities2_runner_nav2/WaypointRunner' provider='capabilities2_runner_nav2/WaypointRunner' x='5.0' y='5.0' />
                          <Control type='recovery' name='return_to_home_if_lost'>
                              <Runner interface='capabilities2_runner_nav2/WaypointRunner' provider='capabilities2_runner_nav2/WaypointRunner' x='0.0' y='0.0' />
                          </Control>
                          <Runner interface='capabilities2_runner_nav2/WaypointRunner' provider='capabilities2_runner_nav2/WaypointRunner' x='2.0' y='2.0' />
                          <Runner interface='capabilities2_runner_nav2/WaypointRunner' provider='capabilities2_runner_nav2/WaypointRunner' x='3.0' y='1.0' />
                      </Control>
                      <Runner interface='capabilities2_runner_fabric/FabricCompletionRunner' provider='capabilities2_runner_fabric/FabricCompletionRunner'/>
                  </Control>
              </Plan>'"
interface:
  services:
    "/prompt":
      type: "prompt_msgs/srv/Prompt"
      description: "This capability focuses on requesting a decision making authority to create a plan for a specific task."